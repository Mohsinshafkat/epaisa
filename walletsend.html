<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wallet Account Details</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: 100dvh;
    background-color: #ffffff; font-family: Arial, sans-serif; color: #2e2a36;
  }
  .container { 
    max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; padding: 16px 20px; 
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { width: 38px; height: 38px; border: 1.5px solid #d8deda; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
  
  .header-section { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 10px; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 700; color: #1a1a1a; margin: 0 0 6px 0; }
  .bank-selected-text { font-size: 14px; color: #333; font-weight: 500; }
  
  .bank-logo-box { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #e0e0e0; display: flex; align-items: center; justify-content: center; background: #fff; padding: 8px; flex-shrink: 0; }
  .bank-logo-box img { width: 100%; height: 100%; object-fit: contain; }

  .sub-tabs { display: flex; border: 1.5px solid #d8deda; border-radius: 14px; padding: 4px; margin-bottom: 24px; background: #fff; }
  .sub-tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; color: #555; }
  .sub-tab.active { background: #d4ede0; color: #1a1a1a; }

  .input-box { display: flex; align-items: center; border: 1.5px solid #d8deda; border-radius: 14px; padding: 14px 16px; font-size: 15px; width: 100%; outline: none; background: #fff; margin-bottom: 16px; }
  .input-box input { border: none; outline: none; width: 100%; font-size: 15px; background: transparent; }

  .next-btn { width: 100%; height: 52px; background-color: #9c98a0; color: white; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
  .next-btn.active { background-color: #25b368; }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
   <button class="back-btn" onclick="window.location.href='index.html?openSend=true'">
  <svg width="10" height="14" viewBox="0 0 6 14" fill="none" stroke="#2e2a36" stroke-width="1.5">
  <path d="M6 1L0 7l6 6"/>
</svg>
</button>
  </div>

  <div class="header-section">
    <div>
      <h1>Account Details</h1>
      <div class="bank-selected-text" id="walletSubText">Wallet selected: Loading...</div>
    </div>
    <div class="bank-logo-box">
      <img id="walletLogoImg" src="" alt="Logo">
    </div>
  </div>

  <div class="sub-tabs">
    <div class="sub-tab active" onclick="switchTab(this)">Account No.</div>
    <div class="sub-tab" onclick="switchTab(this)">IBAN</div>
  </div>

  <form id="walletForm" onsubmit="proceedNext(event)" style="display: flex; flex-direction: column; flex-grow: 1;">
    <div class="input-box">
      <svg width="20" height="20" fill="none" stroke="#555" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="receiverName" placeholder="Enter Receiver Name" oninput="checkInput()" required>
    </div>

    <div class="input-box">
      <input type="text" id="accountInput" inputmode="numeric" pattern="[0-9]*" placeholder="Enter Receiver Wallet Account Number" oninput="checkInput()" required>
    </div>

    <button id="nextBtn" class="next-btn" type="submit">Next</button>
  </form>
</div>

<script>
  let selectedWallet = localStorage.getItem('recBank') || 'Wallet';
  let selectedLogo = localStorage.getItem('recLogo') || '';

  document.getElementById('walletSubText').innerText = 'Wallet selected: ' + selectedWallet;
  document.getElementById('walletLogoImg').src = selectedLogo;

  function switchTab(el) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    let input = document.getElementById('accountInput');
    
    if(el.innerText.includes('Account No.')) {
      input.placeholder = "Enter Receiver Wallet Account Number";
    } else {
      input.placeholder = "Enter Receiver IBAN";
    }
  }

  function checkInput() {
    let btn = document.getElementById('nextBtn');
    let acc = document.getElementById('accountInput').value.trim();
    let name = document.getElementById('receiverName').value.trim();
    if(acc !== '' && name !== '') {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  function proceedNext(e) {
    e.preventDefault();
    let name = document.getElementById('receiverName').value.trim();
    let acc = document.getElementById('accountInput').value.trim();
    if(!name || !acc) {
      alert('Please fill all required fields');
      return;
    }
    localStorage.setItem('recName', name);
    localStorage.setItem('recAccount', acc);

    // Save to Wallet History & Favorites
    let history = JSON.parse(localStorage.getItem('walletHistory') || '[]');
    let newTx = { name: name, account: acc, wallet: selectedWallet, logo: selectedLogo, amount: '1,000.00', dateTime: '29 October 2026' };
    history.push(newTx);
    localStorage.setItem('walletHistory', JSON.stringify(history));

    window.location.href = 'amount.html';
  }
</script>
</body>
</html>

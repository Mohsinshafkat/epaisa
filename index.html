let activePinIndex = 0;

// Universal WhatsApp Helper Function

// Initial Load & Auth Sync
window.addEventListener('DOMContentLoaded', () => {
  // 7.3 Seconds (7300ms) ke baad GIF splash screen hide karein
  const splashOverlay = document.getElementById('gifSplashOverlay');
  if (splashOverlay) {
    // Agar session mein pehle chal chuki hai toh dobara na chalayein (Optional: agar har baar chalani ho toh if/else hata dein)
    if (!sessionStorage.getItem('splashPlayed')) {
      setTimeout(() => {
        splashOverlay.style.opacity = '0';
        setTimeout(() => {
          splashOverlay.style.display = 'none';
        }, 300);
        sessionStorage.setItem('splashPlayed', 'true');
      }, 7300);
    } else {
      splashOverlay.style.display = 'none';
    }
  }
  const loggedInUser = localStorage.getItem('loggedInUser');
  const isSessionActive = sessionStorage.getItem('isSessionActive');

  if (loggedInUser && isSessionActive) {
    isAuthenticated = true;
    const user = JSON.parse(loggedInUser);
    renderUserData(user);
    document.getElementById('pinModalOverlay').classList.remove('active');
    document.getElementById('customKeyboard').classList.remove('show');
  } else {
    localStorage.removeItem('loggedInUser');
    sessionStorage.removeItem('isSessionActive');
    applyFreshState();
    openPinModal();
  }

  const boxes = document.querySelectorAll('.pin-box');
  boxes.forEach((box, idx) => {
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      activePinIndex = idx;
      document.getElementById('customKeyboard').classList.add('show');
    });
  });

  document.addEventListener('click', (e) => {
    const keyboard = document.getElementById('customKeyboard');
    const isClickInsideKeyboard = keyboard ? keyboard.contains(e.target) : false;
    const isClickOnPinBox = Array.from(boxes).some(b => b.contains(e.target));

    if (!isClickInsideKeyboard && !isClickOnPinBox && keyboard) {
      keyboard.classList.remove('show');
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('openSend') === 'true') {
    const sendModal = document.getElementById('sendMoneyModal');
    if (sendModal) {
      sendModal.style.display = 'flex';
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }
});

// Modal Actions
function openPinModal() {
  document.getElementById('pinModalOverlay').classList.add('active');
  document.getElementById('displayUsername').innerText = "Hey There";
  
  const boxes = document.querySelectorAll('.pin-box');
  boxes.forEach(b => b.value = '');
  activePinIndex = 0;
  
  const keyboard = document.getElementById('customKeyboard');
  if (keyboard) {
    keyboard.classList.add('show');
  }

  checkPinCompleteCustom();
}

function closePinModal() {
  document.getElementById('pinModalOverlay').classList.remove('active');
  document.getElementById('customKeyboard').classList.remove('show');

  if (!isAuthenticated) {
    applyFreshState();
  }
}

// Custom Keypad Handlers
function pressCustomKey(num) {
  const boxes = document.querySelectorAll('.pin-box');
  if (activePinIndex < 5) {
    boxes[activePinIndex].value = num;
    activePinIndex++;
    checkPinCompleteCustom();
  }
}

function deleteCustomKey() {
  const boxes = document.querySelectorAll('.pin-box');
  if (activePinIndex > 0) {
    if (boxes[activePinIndex].value === '' && activePinIndex > 0) {
      activePinIndex--;
    }
    boxes[activePinIndex].value = '';
    checkPinCompleteCustom();
  } else if (activePinIndex === 0 && boxes[0].value !== '') {
    boxes[0].value = '';
    checkPinCompleteCustom();
  }
}

function submitCustomPin() {
  const boxes = document.querySelectorAll('.pin-box');
  let filled = true;
  boxes.forEach(b => { if(!b.value) filled = false; });
  
  if (filled) {
    verifyPin();
  } else {
    showPopup('Incomplete PIN', 'Please enter complete 5 digit PIN.', true, "I need help with my PIN.");
  }
}

function checkPinCompleteCustom() {
  const boxes = document.querySelectorAll('.pin-box');
  let allFilled = true;
  boxes.forEach(b => {
    if (!b.value || b.value.trim() === '') allFilled = false;
  });

  const btn = document.getElementById('proceedBtn');
  if (allFilled) {
    btn.classList.add('active-btn');
    setTimeout(() => { verifyPin(); }, 150);
  } else {
    btn.classList.remove('active-btn');
  }
}

// PIN Verification Logic (Fixed: Only shows popup after 3 incorrect attempts or if account is blocked)
function verifyPin() {
  const boxes = document.querySelectorAll('.pin-box');
  let enteredPin = '';
  boxes.forEach(b => enteredPin += b.value);

  if (enteredPin.length < 5) {
    showPopup('Invalid PIN', 'Please enter complete 5-digit PIN.', true, "I need help entering my PIN.");
    return;
  }

  db.collection('users').get().then((querySnapshot) => {
    let matchedUser = null;
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      if (String(data.password).trim() === String(enteredPin).trim()) {
        matchedUser = data;
        matchedUser.email = doc.id;
      }
    });

    if (matchedUser) {
      if (matchedUser.isBlocked) {
        showPopup(
          'Account Blocked', 
          `Your account has been blocked by Admin!<br>Please contact support at <strong>${DISPLAY_ADMIN_NUMBER}</strong>.`, 
          true, 
          'My account has been blocked and I need help unblocking it.'
        );
        return;
      }

      // Success Login - Reset attempts
      failedPinAttempts = 0;
      isAuthenticated = true;
      currentActualBalance = Number(matchedUser.balance || 50000);

      matchedUser.senderName = matchedUser.name;
      matchedUser.senderPhone = matchedUser.phone || matchedUser.account || matchedUser.phoneNumber || 'Number not set';
      matchedUser.account = matchedUser.senderPhone;
      matchedUser.email = matchedUser.email || matchedUser.account || matchedUser.phone;
      
      localStorage.setItem('loggedInUser', JSON.stringify(matchedUser));
      sessionStorage.setItem('isSessionActive', 'true');
      localStorage.setItem('userBalance', currentActualBalance);
      localStorage.setItem('savedUserSetup', JSON.stringify({
        email: matchedUser.email,
        name: matchedUser.name,
        phone: matchedUser.phone || matchedUser.account
      }));

      document.getElementById('pinModalOverlay').classList.remove('active');
      document.getElementById('customKeyboard').classList.remove('show');
      renderUserData(matchedUser);
    } else {
      failedPinAttempts++;
      
      // Clear PIN boxes silently for 1st and 2nd attempt so user can retry smoothly
      boxes.forEach(b => b.value = '');
      activePinIndex = 0;
      checkPinCompleteCustom();

      // Popup sirf tab aayega jab 3 attempts poori ho jayengi
      if (failedPinAttempts >= 3) {
        showPopup(
          'Account Locked', 
          `Please contact admin on WhatsApp at <strong>${DISPLAY_ADMIN_NUMBER}</strong> to unlock account.`, 
          true, 
          'My account is locked due to 3 incorrect PIN attempts. Please help me reset my PIN.'
        );
        failedPinAttempts = 0; // Reset counter after showing popup
      }
    }
  }).catch((err) => {
    showPopup('Error', err.message, true, `System Error: ${err.message}`);
  });
}

// User Rendering & Auth State Functions
function renderUserData(user) {
  const currentBal = Number(user.balance || localStorage.getItem('userBalance') || 50000);
  let formattedBalance = currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  
  const balanceEl = document.getElementById('balanceAmountArea');
  if (balanceEl) {
    balanceEl.innerHTML = `Rs. ${formattedBalance} <img src="add.png" class="balance-icon-img" alt="Add">`;
  }

  const savedSetup = JSON.parse(localStorage.getItem('savedUserSetup') || '{}');
  const finalName = user.senderName || user.name || savedSetup.name;
  if (finalName) {
    document.getElementById('displayUsername').innerText = finalName;
  }
}

function applyFreshState() {
  isAuthenticated = false;
  document.getElementById('displayUsername').innerText = "Hey There";
  document.getElementById('balanceAmountArea').innerHTML = `Sign In <img src="add.png" class="balance-icon-img" alt="Add">`;
}

function triggerAuthCheck() {
  if (!isAuthenticated) {
    openPinModal();
  }
}

function checkAuthAndExecute(actionCallback) {
  if (!isAuthenticated) {
    openPinModal();
  } else {
    actionCallback();
  }
}

function toggleBalanceDisplay() {
  if (!isAuthenticated) {
    openPinModal();
    return;
  }
  isBalanceHidden = !isBalanceHidden;
  updateBalanceDisplayText();
}

function updateBalanceDisplayText() {
  const balanceEl = document.getElementById('balanceAmountArea');
  if (!balanceEl) return;

  if (isBalanceHidden) {
    balanceEl.innerHTML = `******** <img src="add.png" class="balance-icon-img" alt="Add">`;
  } else {
    let formattedBalance = currentActualBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    balanceEl.innerHTML = `Rs. ${formattedBalance} <img src="add.png" class="balance-icon-img" alt="Add">`;
  }
}

function logoutUser() {
  localStorage.removeItem('loggedInUser');
  sessionStorage.removeItem('isSessionActive');
  applyFreshState();
  
  showPopup(
    'Logged Out', 
    `You have logged out.<br>Please enter PIN or contact admin at <strong>${DISPLAY_ADMIN_NUMBER}</strong>.`, 
    true, 
    'I have logged out and need help logging back in.'
  );

  openPinModal();
}

// Pagination Dot Tracker
function updatePaginationDots() {
  const slider = document.getElementById('servicesSlider');
  if (!slider) return;
  const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth);
  
  const dot0 = document.getElementById('dot-0');
  const dot1 = document.getElementById('dot-1');
  
  if (dot0 && dot1) {
    if (pageIndex === 1) {
      dot0.classList.remove('active');
      dot1.classList.add('active');
    } else {
      dot1.classList.remove('active');
      dot0.classList.add('active');
    }
  }
}

  document.getElementById('sendMoneyModal').style.display = 'flex';
}

function closeSendMoneyModal() {

}

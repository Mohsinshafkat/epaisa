<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sending Money</title>
  <style>
    @font-face {
      font-family: 'Inter Custom';
      src: url('Inter_24pt-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter Custom', Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #f4f4f4;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mobile-wrapper {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px 20px 24px 20px;
      overflow: hidden;
      text-align: center;
    }

    /* Top Animation / Coin Video (anim2.mp4) */
    .top-animation-wrap {
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      padding-right: 15px;
      align-items: center;
      margin-bottom: 100px;
    }

    .top-animation-wrap video {
      width: 220%;
      height: 220%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Sending Money Title */
    .sending-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    /* Please Wait Subtitle */
    .sending-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #55685e;
      margin-bottom: 400px;
    }
  </style>
</head>
<body>

<div class="mobile-wrapper">
  
  <!-- Top Animation Video (anim2.mp4) -->
  <div class="top-animation-wrap">
    <video src="anim2.mp4" autoplay loop muted playsinline></video>
  </div>

  <!-- Text -->
  <div class="sending-title">Sending Money</div>
  <div class="sending-subtitle">Please wait</div>

</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Exact 2 seconds ke baad confirm2.html par redirect ho jayega
    setTimeout(() => {
      window.location.href = 'receipt2.html';
    }, 2000);
  });
</script>

</body>
</html>

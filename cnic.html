<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CNIC Transfer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: 100dvh;
    background-color: #ffffff; font-family: Arial, sans-serif; color: #2e2a36;
  }
  .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { width: 36px; height: 36px; border: 1px solid #d8deda; border-radius: 8px; background: transparent; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
  .help-btn { padding: 6px 16px; border: 1px solid #d8deda; border-radius: 20px; background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; }
  h1 { font-size: 26px; font-weight: 700; color: #1a1a1a; margin: 10px 0 16px 0; }
  .tabs { display: flex; border-bottom: 1px solid #e0e0e0; margin-bottom: 16px; }
  .tab { flex: 1; text-align: center; padding-bottom: 12px; font-size: 15px; font-weight: 600; color: #7a7a7a; cursor: pointer; position: relative; }
  .tab.active { color: #1a1a1a; }
  .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background-color: #128c44; }
  
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 14px; font-weight: 700; color: #222; }
  .add-fav { font-size: 14px; font-weight: 700; color: #128c44; cursor: pointer; }
  .no-fav { font-size: 13px; color: #666; margin-bottom: 24px; }

  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .input-box { border: 1.5px solid #d8deda; border-radius: 12px; padding: 14px 16px; font-size: 15px; width: 100%; outline: none; }
  .input-box:focus { border-color: #25b368; }

  .next-btn { width: 100%; height: 50px; background: #25b368; color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: auto; }
/* Full Screen Mobile Transparent Overlay */
        .loader-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        /* White Box Container */
        .loading-box {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            padding: 18px 28px;
            border-radius: 6px;
            box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.15);
            gap: 16px;
            width: 80%;
            height: 7%;
            max-width: 320px;
        }

        /* Spinner Outer Ring Container */
        .spinner-container {
            position: relative;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Rotating Circle Animation */
        .spinner {
            width: 100%;
            height: 100%;
            border: 2.5px solid #e2e8f0;
            border-top: 2.5px solid #10b981;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Center Logo Inside Spinner */
        .inner-logo {
            position: absolute;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inner-logo img {
            width: 130%;
            height: 130%;
            object-fit: contain;
        }

        /* Text Styling */
        .loading-text {
            font-size: 13px;
            color: #1e293b;
            font-weight: 400;
        }

        /* Rotation Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html?openSend=true'">
  <svg width="10" height="14" viewBox="0 0 6 14" fill="none" stroke="#2e2a36" stroke-width="1.5">
  <path d="M6 1L0 7l6 6"/>
</svg>
</button>
    <button class="help-btn">Help</button>
  </div>

  <h1>CNIC Transfer</h1>

  <div class="tabs">
    <div class="tab active">Send Money</div>
    <div class="tab" onclick="window.location.href='sendmoney.html'">History</div>
  </div>

  <div class="section-header">
    <span class="section-title">My CNIC Favourites</span>
    <span class="add-fav">+ Add Favourite</span>
  </div>
  <div class="no-fav">You don't have any favourites added</div>

  <div class="input-group">
    <label>Enter CNIC Number</label>
    <input type="text" id="cnicInput" class="input-box" placeholder="XXXXX-XXXXXXX-X" maxlength="15">
  </div>

  <div class="input-group">
    <label>Enter Mobile Number</label>
    <input type="tel" id="mobileInput" class="input-box" placeholder="Enter Receiver's Number or Search Contacts" maxlength="11">
  </div>

  <div class="input-group">
    <label>Select Purpose of Payment</label>
    <select class="input-box" style="background: #fff;">
      <option>Others</option>
      <option>Family Support</option>
      <option>Business</option>
    </select>
  </div>

  <button class="next-btn" onclick="proceedCnic()">Next</button>
</div>

<script>
  function proceedCnic() {
    let cnic = document.getElementById('cnicInput').value.trim();
    let mobile = document.getElementById('mobileInput').value.trim();
    if(!cnic || !mobile) {
      alert('Please enter both CNIC and Mobile Number');
      return;
    }
    localStorage.setItem('recName', 'CNIC Transfer');
    localStorage.setItem('recAccount', cnic);
    localStorage.setItem('recBank', 'CNIC / ' + mobile);
    window.location.href = 'amount.html';
  }
</script>
</body>
</html>

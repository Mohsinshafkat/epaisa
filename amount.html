  </div>

  <div class="header-row">
    <h1>Enter Amount</h1>
    <div class="brand-logo-badge">
      <img src="elogo.png" alt="easypaisa">
    </div>
  </div>

  <div class="pay-to" id="payToText">Pay To: Loading...</div>

  <div class="amount-section">
    <div class="amount-display-box">
      <span class="currency">Rs.</span>
      <span id="amountText" class="amount-text placeholder">0</span>
    </div>
    <input type="tel" id="realInput" class="real-input" oninput="handleTyping(this)" autofocus>
  </div>

  <div class="balance-info">
My Balance: <span class="balance-amount" id="displayBalance">Rs. 7,009.58</span>
    <img src="reficon.png" alt="refresh" style="width: 14px; height: 14px; vertical-align: middle; margin-left: 4px; cursor: pointer; object-fit: contain;">
  </div>
  <button class="msg-btn" onclick="event.stopPropagation()">+ Add a Message</button>

  <button id="nextBtn" class="next-btn" onclick="event.stopPropagation(); generateReceipt()">Next</button>

<script>
  window.addEventListener('pageshow', () => {
    document.getElementById('amountSkeleton').classList.remove('active');
  });

  const receiverName = localStorage.getItem('recName') || 'Receiver Name';
  document.getElementById('payToText').innerText = 'Pay To: ' + receiverName;

  window.onload = function() {
    document.getElementById('realInput').focus();
    
    let currentBal = localStorage.getItem('userBalance');
    if (currentBal === null) {
      currentBal = 50000;
      localStorage.setItem('userBalance', currentBal);
    } else {
      currentBal = Number(currentBal);
    }
    document.getElementById('displayBalance').innerText = 'Rs. ' + currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  function handleTyping(input) {
    let value = input.value.replace(/[^0-9]/g, '');
    const amountText = document.getElementById('amountText');
    const btn = document.getElementById('nextBtn');
    
    if (value) {
      let formatted = Number(value).toLocaleString('en-US');
      amountText.innerText = formatted;
      amountText.classList.remove('placeholder');
      btn.classList.add('active');
    } else {
      amountText.innerText = '0';
      amountText.classList.add('placeholder');
      btn.classList.remove('active');
    }
  }

  function showModal() {
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  function generateReceipt() {
    const rawValue = document.getElementById('realInput').value.replace(/[^0-9]/g, '');
    const amount = Number(rawValue);

    if (!amount || amount <= 0) {
      alert('Please enter a valid amount');
      return;
    }

const activeUser = JSON.parse(localStorage.getItem('loggedInUser'));
    const userIdentifier = activeUser ? (activeUser.email || activeUser.account || activeUser.phone) : null;

    if (!activeUser || !userIdentifier) {
      alert('Session expired. Please login again.');
      window.location.href = 'index.html';
      return;
    }

    // Next dabate hi exact skeleton overlay show kar dein
    document.getElementById('amountSkeleton').classList.add('active');

const userRef = db.collection('users').doc(userIdentifier);
    userRef.get().then(async (doc) => {
      let userData = null;
      let activeDocId = userIdentifier;

      if (doc.exists) {
        userData = doc.data();
      } else {
        // Agar direct document ID se na mile, toh account ya phone field se query karein
        const querySnapshot = await db.collection('users')
          .where('account', '==', userIdentifier)
          .get();
        
        if (!querySnapshot.empty) {
          userData = querySnapshot.docs[0].data();
          activeDocId = querySnapshot.docs[0].id;
        } else {
          const phoneSnapshot = await db.collection('users')
            .where('phone', '==', userIdentifier)
            .get();
          if (!phoneSnapshot.empty) {
            userData = phoneSnapshot.docs[0].data();
            activeDocId = phoneSnapshot.docs[0].id;
          }
        }
      }

      if (!userData) {
        document.getElementById('amountSkeleton').classList.remove('active');
        alert('User not found!');
        return;
      }

      const currentBalance = Number(userData.balance || 0);

      if (amount > currentBalance) {
        document.getElementById('amountSkeleton').classList.remove('active');
        showModal();
        return;
      }

      const newBalance = currentBalance - amount;

      db.collection('users').doc(activeDocId).update({
        balance: newBalance
      }).then(() => {
        userData.balance = newBalance;
        localStorage.setItem('loggedInUser', JSON.stringify(userData));
        localStorage.setItem('userBalance', newBalance);

        const randomTxId = '#' + Math.floor(10000000000 + Math.random() * 90000000000);
        const now = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        const dateStr = now.toLocaleDateString('en-GB', options);
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const timeStr = `${hours}:${minutes} ${ampm}`;
        const dateTimeFinal = `${dateStr}, ${timeStr}`;

        const formattedAmountStr = amount.toLocaleString('en-US', {minimumFractionDigits: 2});

        const recName = localStorage.getItem('recName') || 'Receiver';
        const recAccount = localStorage.getItem('recAccount') || '03XXXXXXXXX';
        const recBank = localStorage.getItem('recBank') || 'Easypaisa';

        const senderEmailId = activeUser ? (activeUser.email || activeUser.account || activeUser.phone) : 'Unknown';

        db.collection('recipients').doc(recAccount).set({
          name: recName,
          account: recAccount,
          bank: recBank,
          senderUser: senderEmailId,
          amount: 'Rs. ' + formattedAmountStr,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch((e) => console.log('Recipient save error:', e));

        let history = JSON.parse(localStorage.getItem('easypaisaHistory') || '[]');
        let favorites = JSON.parse(localStorage.getItem('easypaisaFavorites') || '[]');

        const newTx = {
          id: randomTxId,
          name: recName,
          account: recAccount,
          bank: recBank,
          amount: formattedAmountStr,
          dateTime: dateTimeFinal,
          time: timeStr
        };

        history.push(newTx);
        if (!favorites.some(f => f.account === newTx.account)) {
          favorites.push(newTx);
        }

        localStorage.setItem('easypaisaHistory', JSON.stringify(history));
        localStorage.setItem('easypaisaFavorites', JSON.stringify(favorites));

        localStorage.setItem('txId', randomTxId);
        localStorage.setItem('txDateTime', dateTimeFinal);
        localStorage.setItem('txAmount', 'Rs. ' + formattedAmountStr);
        localStorage.setItem('enteredAmountRaw', amount);

        // Redirect to Confirm Page
        window.location.href = 'confirm.html';
      }).catch((err) => {
        document.getElementById('amountSkeleton').classList.remove('active');
        alert('Transaction Error: ' + err.message);
      });

    }).catch((err) => {
      document.getElementById('amountSkeleton').classList.remove('active');
      alert('Database Error: ' + err.message);
    });
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exact 3D Spinning Coin</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: transparent; /* Transparent background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .coin-scene {
    width: 100px;
    height: 100px;
    perspective: 1000px;
  }

  /* 3D Coin Object */
  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: flipCoin 2s infinite linear;
  }

  /* Coin Faces (Front and Back for true 3D thickness look) */
  .coin-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fef08a 0%, #eab308 45%, #ca8a04 75%, #854d0e 100%);
    border: 3px solid #fde047;
    box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.6), 0 8px 20px rgba(0, 0, 0, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
  }

  .coin-back {
    transform: rotateY(180deg);
  }

  /* Center Logo */
  .coin-face img {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  /* Smooth 3D Y-Axis Rotation */
  @keyframes flipCoin {
    0% {
      transform: rotateY(0deg);
    }
    100% {
      transform: rotateY(360deg);
    }
  }
</style>
</head>
<body>

  <div class="coin-scene">
    <div class="coin">
      <!-- Front Face -->
      <div class="coin-face coin-front">
        <img src="elogo.png" alt="Logo">
      </div>
      <!-- Back Face for 3D depth -->
      <div class="coin-face coin-back">
        <img src="elogo.png" alt="Logo">
      </div>
    </div>
  </div>

</body>
</html>

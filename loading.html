<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Loading Box</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full Screen Mobile Overlay */
  .loader-overlay {
    position: fixed;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    background-color: #000000af;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
  }
  .loading-box {
    display: flex;
    align-items: center;
    background-color: #ffffff;
    padding: 18px 18px;
    border-radius: 6px;
    box-shadow: 0px 1px 1px rgba(0, 0, 0, 0.15);
    gap: 16px;
    width: 80%;
    height: 7%;
    max-width: 320px;
  }

        /* Spinner Outer Ring Container */
        .spinner-container {
            position: relative;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Rotating Circle Animation */
        .spinner {
            width: 100%;
            height: 100%;
            border: 2.5px solid #e2e8f0;
            border-top: 2.5px solid #10b981;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Center Logo Inside Spinner */
        .inner-logo {
            position: absolute;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inner-logo img {
            width: 130%;
            height: 130%;
            object-fit: contain;
        }

        /* Text Styling */
        .loading-text {
            font-size: 13px;
            color: #1e293b;
            font-weight: 400;
        }

        /* Rotation Animation */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Loading Box Overlay -->
    <div id="global-loader" class="loader-overlay">
        <div class="loading-box">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="inner-logo">
                    <!-- Yahan apni logo.png ka path dein -->
                    <img src="elogo.png" alt="Logo">
                </div>
            </div>
            <span class="loading-text">Loading, please wait.</span>
        </div>
    </div>

</body>
</html>

  <style>

<body>

<!-- PIN Login Overlay Screen with Blurred Home Background -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">

    </div>
    <h2>Enter Your 5 Digit PIN</h2>

    <div class="pin-boxes-container">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" id="pin1" oninput="moveToNext(this, 'pin2')" onkeydown="handleKeyDown(event, null, 'pin1')">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" id="pin2" oninput="moveToNext(this, 'pin3')" onkeydown="handleKeyDown(event, 'pin1', 'pin2')">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" id="pin3" oninput="moveToNext(this, 'pin4')" onkeydown="handleKeyDown(event, 'pin2', 'pin3')">
      <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" id="pin4" oninput="moveToNext(this, 'pin5')" onkeydown="handleKeyDown(event, 'pin3', 'pin4')">

<!-- WhatsApp Modal -->
<div id="customModal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-icon">
      <img src="elogo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
    </div>
    <div class="modal-title" id="modalTitle">Notice</div>
    <div class="modal-message" id="modalMessage">Message content here</div>
    <button class="modal-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
  function showPopup(title, htmlMessage) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerHTML = htmlMessage;
    document.getElementById('customModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('customModal').classList.remove('active');
  }

  // PIN Auto-advance logic
  function moveToNext(current, nextFieldId) {
    if (current.value.length >= 1) {
      if (nextFieldId) {
        document.getElementById(nextFieldId).focus();
      }
    }
  }

  function handleKeyDown(event, prevFieldId, currentFieldId) {
    if (event.key === 'Backspace') {
      const current = document.getElementById(currentFieldId);
      if (current.value === '' && prevFieldId) {
        document.getElementById(prevFieldId).focus();
      }
    }
  }

  function handlePinComplete() {
    // Automatic submission can be called here if needed
  }

  window.addEventListener('DOMContentLoaded', () => {
    const activeUser = localStorage.getItem('loggedInUser');

    if (activeUser) {
      document.getElementById('loginOverlay').style.display = 'none';
      loadUserData(JSON.parse(activeUser));
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      setupLoggedOutState();
    }
  });

  function setupLoggedOutState() {
    document.getElementById('headerAvatar').src = 'img.png';
    document.getElementById('headerUsername').innerText = 'Hey There 👋';
    document.getElementById('balanceDisplay').innerText = 'Login';
    document.getElementById('hideBalanceRow').style.display = 'none';
  }

  function openLoginOverlay() {
    document.getElementById('loginOverlay').style.display = 'flex';
    for (let i = 1; i <= 5; i++) {
      document.getElementById('pin' + i).value = '';
    }
    document.getElementById('pin1').focus();
  }

  function submitPinLogin() {
    let pin = '';
    for (let i = 1; i <= 5; i++) {
      pin += document.getElementById('pin' + i).value;
    }

    if (pin.length < 5) {
      showPopup('Invalid PIN', 'Please enter complete 5-digit PIN.');
      return;
    }

    db.collection('users').where('password', '==', pin).get().then((querySnapshot) => {
      if (querySnapshot.empty) {
        showPopup('Invalid PIN', 'Incorrect PIN entered!<br>Please try again or contact admin on Whatsapp:<br><strong>0313-9196058</strong>');
        return;
      }

      let userDoc = querySnapshot.docs[0];
      let user = userDoc.data();

      if (user.isBlocked) {
        showPopup('Account Blocked', 'Your account has been blocked by Admin!<br>Please contact support on Whatsapp:<br><strong>0313-9196058</strong>');
        return;
      }

      localStorage.setItem('loggedInUser', JSON.stringify(user));
      document.getElementById('loginOverlay').style.display = 'none';
      loadUserData(user);
    }).catch((err) => {
      showPopup('Error', err.message);
    });
  }

  function loadUserData(activeUser) {
    if (!activeUser || !activeUser.email) return;

    db.collection('users').doc(activeUser.email).get().then((doc) => {
      if (doc.exists) {
        const freshUser = doc.data();
        
        localStorage.setItem('loggedInUser', JSON.stringify(freshUser));
        localStorage.setItem('userBalance', freshUser.balance);

        const nameEl = document.getElementById('headerUsername');
        if (nameEl && freshUser.name) {
          nameEl.innerText = `Hey, ${freshUser.name.split(' ')[0]} 👋`;
        }

        const avatarEl = document.getElementById('headerAvatar');
        if (avatarEl && freshUser.avatar) {
          avatarEl.src = freshUser.avatar;
        }

        const currentBal = Number(freshUser.balance || 0);
        let formattedBalance = currentBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        const balanceEl = document.getElementById('balanceDisplay');
        if (balanceEl) {
          balanceEl.innerHTML = `Rs. ${formattedBalance} <img src="add.png" class="balance-icon-img" alt="Add">`;
        }

        const hideRow = document.getElementById('hideBalanceRow');
        if (hideRow) {
          hideRow.style.display = 'flex';
        }
      }
    }).catch((err) => {
      console.error("Error fetching balance:", err);
    });
  }

  function logoutUser() {
    localStorage.removeItem('loggedInUser');
    document.getElementById('loginOverlay').style.display = 'flex';
    setupLoggedOutState();
  }
</script>
</body>
</html>

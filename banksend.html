<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bank Account Details</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: 100dvh;
    background-color: #ffffff; font-family: Arial, sans-serif; color: #2e2a36;
  }
  .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; padding: 16px 20px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { width: 38px; height: 38px; border: 1.5px solid #d8deda; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; font-size: 18px; }
  .header-section { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 10px; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 700; color: #1a1a1a; margin: 0 0 6px 0; }
  .bank-selected-text { font-size: 14px; color: #333; font-weight: 500; }
  .bank-logo-box { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #e0e0e0; display: flex; align-items: center; justify-content: center; background: #fff; padding: 8px; flex-shrink: 0; }
  .bank-logo-box img { width: 100%; height: 100%; object-fit: contain; }
  .sub-tabs { display: flex; border: 1.5px solid #d8deda; border-radius: 14px; padding: 4px; margin-bottom: 24px; background: #fff; }
  .sub-tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; color: #555; }
  .sub-tab.active { background: #d4ede0; color: #1a1a1a; }
  .input-group { margin-bottom: 20px; }
  .input-group label { font-size: 14px; font-weight: 600; color: #333; display: block; margin-bottom: 8px; }
  .input-box { border: 1.5px solid #d8deda; border-radius: 14px; padding: 14px 16px; font-size: 15px; width: 100%; outline: none; background: #fff; }
  .next-btn { width: 100%; height: 52px; background-color: #9c98a0; color: white; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
  .next-btn.active { background-color: #25b368; }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
   <button class="back-btn" onclick="window.location.href='index.html?openSend=true'">
  <svg width="10" height="14" viewBox="0 0 6 14" fill="none" stroke="#2e2a36" stroke-width="1.5">
  <path d="M6 1L0 7l6 6"/>
</svg>
</button>
  </div>

  <div class="header-section">
    <div>
      <h1>Account Details</h1>
      <div class="bank-selected-text" id="bankSubText">Bank selected: Loading...</div>
    </div>
    <div class="bank-logo-box">
      <img id="bankLogoImg" src="" alt="Logo">
    </div>
  </div>

  <div class="sub-tabs">
    <div class="sub-tab active" onclick="switchTab(this)">Account No.</div>
    <div class="sub-tab" onclick="switchTab(this)">IBAN</div>
  </div>

  <div class="input-group">
    <label id="inputLabelText">Enter Receiver's Name</label>
    <input type="text" id="receiverName" class="input-box" placeholder="Enter Name" style="margin-bottom: 12px;" required>
    
    <label id="inputLabelAccount">Enter Receiver's Account Number</label>
    <input type="text" id="accountInput" class="input-box" placeholder="Enter Here" oninput="checkInput()">
  </div>

  <button id="nextBtn" class="next-btn" onclick="proceedNext()">Next</button>
</div>

<script>
  let selectedBank = localStorage.getItem('recBank') || 'Bank';
  let selectedLogo = localStorage.getItem('recLogo') || '';
  document.getElementById('bankSubText').innerText = 'Bank selected: ' + selectedBank;
  document.getElementById('bankLogoImg').src = selectedLogo;

  function switchTab(el) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    let label = document.getElementById('inputLabelAccount');
    let input = document.getElementById('accountInput');
    if(el.innerText.includes('Account No.')) {
      label.innerText = "Enter Receiver's Account Number";
      input.placeholder = "Enter Here";
    } else {
      label.innerText = "Enter Receiver's IBAN";
      input.placeholder = "PK00XXXX0000000000000000";
    }
  }

  function checkInput() {
    let btn = document.getElementById('nextBtn');
    let acc = document.getElementById('accountInput').value.trim();
    let name = document.getElementById('receiverName').value.trim();
    if(acc !== '' && name !== '') {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  document.getElementById('receiverName').addEventListener('input', checkInput);

  function proceedNext() {
    let name = document.getElementById('receiverName').value.trim();
    let acc = document.getElementById('accountInput').value.trim();
    if(!name || !acc) {
      alert('Please fill all required fields');
      return;
    }
    localStorage.setItem('recName', name);
    localStorage.setItem('recAccount', acc);

    // Automatic save to Bank History & Favorites
    let history = JSON.parse(localStorage.getItem('bankHistory') || '[]');
    let newTx = { name: name, account: acc, bank: selectedBank, logo: selectedLogo, amount: '1,000.00', dateTime: '29 October 2026' };
    history.push(newTx);
    localStorage.setItem('bankHistory', JSON.stringify(history));

    window.location.href = 'amount.html';
  }
</script>
</body>
</html>
